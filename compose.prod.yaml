# «Produção» local · local "production" (Aula 08, M2 ponto 8)
#   docker compose -f compose.prod.yaml up --build -d
#   docker compose -f compose.prod.yaml exec web python manage.py migrate
#   docker compose -f compose.prod.yaml exec web python manage.py seed
#   → http://localhost            (HTTP_PORT=8080 no .env se a porta 80 estiver ocupada)
# Duas réplicas da API · two API replicas:  … up -d --scale web=2
name: shop-prod

x-backend: &backend
  build: .
  image: shop-backend:local
  restart: unless-stopped
  environment:
    SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env · set SECRET_KEY in .env}
    DATABASE_URL: postgres://${POSTGRES_USER:-dwfa}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-dwfa}
    REDIS_URL: redis://redis:6379
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
    HTTPS: ${HTTPS:-true}
    EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dwfa}
      POSTGRES_USER: ${POSTGRES_USER:-dwfa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes: [pgdata:/var/lib/postgresql/data]   # sem `ports`: só a rede interna a vê · internal only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:                       # Gunicorn + Uvicorn: HTTP e WebSocket · HTTP and WebSocket
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:                    # a mesma imagem, outro comando · same image, another command
    <<: *backend
    command: celery -A config worker -l info

  nginx:                     # a única porta publicada · the only published port
    build: ./frontend
    image: shop-frontend:local
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80"]
    depends_on:
      web: {condition: service_healthy}

volumes:
  pgdata: {}
