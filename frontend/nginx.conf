# Nginx à frente de tudo · Nginx in front of everything (Aula 08)
# PT: serve a SPA, encaminha /api/, /admin/, /static/ e /ws/ para o backend.
# EN: serves the SPA, proxies /api/, /admin/, /static/ and /ws/ to the backend.

# `web` é o nome do serviço no Compose. Com `--scale web=2` o DNS do Docker devolve
# dois endereços e o Nginx reparte os pedidos por eles (round-robin).
# `web` is the Compose service name. With `--scale web=2` Docker's DNS returns two
# addresses and Nginx spreads requests across them (round-robin).
upstream backend {
    server web:8000;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA: um URL que não é um ficheiro devolve o index.html e o Vue Router resolve-o
    # SPA: a URL that is not a file gets index.html and Vue Router takes over
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ficheiros com hash no nome: cache de um ano · hashed file names: cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # só para a demo: que réplica respondeu · demo only: which replica answered
        add_header X-Upstream $upstream_addr always;
    }

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }
}
